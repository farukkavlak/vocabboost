<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VocabBoost</title>
    <style>
      :root {
        color-scheme: dark;
        --accent: #d0451b;
      }

      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: #16161a;
        color: #f2f2f5;
        font:
          13px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
      }

      fieldset {
        margin: 0 0 12px;
        padding: 0;
        border: 0;
      }

      legend,
      label.field {
        display: block;
        margin-bottom: 5px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
      }

      .providers {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
      }

      .providers label {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }

      input[type="password"],
      select {
        box-sizing: border-box;
        width: 100%;
        padding: 6px 8px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        font: inherit;
      }

      input[type="password"]:focus,
      select:focus {
        border-color: var(--accent);
        outline: none;
      }

      a {
        color: #ffb59b;
        font-size: 12px;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      button {
        padding: 6px 12px;
        border: 0;
        border-radius: 7px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      button.link {
        padding: 0;
        background: none;
        color: #ffb59b;
        font-size: 12px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 6px;
      }

      hr {
        margin: 14px 0 10px;
        border: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
      }

      .setting + .setting {
        margin-top: 8px;
      }

      kbd {
        padding: 1px 5px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 4px;
        color: #f2f2f5;
        font: inherit;
      }

      .said {
        min-height: 16px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
      }

      .said.wrong {
        color: #ffb59b;
      }
    </style>
  </head>
  <body>
    <h1>VocabBoost</h1>

    <fieldset>
      <legend>Model</legend>
      <div class="providers" id="providers"></div>
    </fieldset>

    <p class="said" id="does"></p>

    <div id="credentials">
      <label class="field" for="key">Key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" />
      <div class="row">
        <a id="get-key" href="#" target="_blank" rel="noreferrer">Get a key</a>
        <button id="save" type="button">Save</button>
      </div>
    </div>
    <p class="said" id="said"></p>

    <div id="translate">
      <label class="field" for="language">Also translate into</label>
      <select id="language">
        <option value="">Nothing — stay in English</option>
        <option value="Turkish">Turkish</option>
        <option value="German">German</option>
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
      </select>
    </div>

    <hr />

    <div class="setting">
      <span>Words you looked up</span>
      <button class="link" id="open-log" type="button">open the log</button>
    </div>

    <div class="setting">
      <span>Shortcut <kbd id="shortcut">not set</kbd></span>
      <button class="link" id="change-shortcut" type="button">change</button>
    </div>

    <script type="module" src="settings.js"></script>
  </body>
</html>
